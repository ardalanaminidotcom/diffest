packages:
  - apps/*
  - packages/*

tasks:
  build:
    dependsOn:
      - ^build
  test:
    dependsOn:
      - ^test
  test:coverage:
    dependsOn:
      - ^test:coverage

includeWorkspaceRoot: false

injectWorkspacePackages: true

# svelte-check 4 requires TypeScript 6 for its default CLI mode.
packageExtensions:
  svelte-check@4.7.8:
    dependencies:
      typescript: "6.0.3"

overrides:
  "svelte-check@4.7.8>typescript:peer": "-"

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

autoDedupe: true

lockfile:
  includeResolutionSettings: true

cargo:
  enabled: true

allowBuilds:
  "@parcel/watcher": false
  lefthook: false
  unrs-resolver: false

# Keep release style-src strict while Pierre requires inline CSS.
# https://github.com/pierrecomputer/pierre/issues/1251
patchedDependencies:
  '@pierre/diffs@1.7.2': patches/@pierre__diffs@1.7.2.patch
