name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Desktop compile (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    environment: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-desktop
        with:
          target: ${{ matrix.target }}

      - name: Compile Desktop
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter diffest-desktop build --target "$TARGET" --no-bundle -- --locked

  build-result:
    name: Build
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all six Desktop compiles
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success

  lint:
    name: Lint & Type Check

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check code styles and types
        run: pnpm lint:typecheck

  knip:
    name: Knip

    runs-on: ubuntu-latest

    timeout-minutes: 5

    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check dead code/dependency
        run: pnpm knip

  test:
    name: Test

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Test Desktop release preparation
        run: node --test scripts/release-desktop.test.mjs
